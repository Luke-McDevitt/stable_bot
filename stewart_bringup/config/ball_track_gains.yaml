# BALL_TRACK gains — drive Demos 1, 2, 3.
# See stewart_control_node._load_ball_track_gains() for full docs.
kp: 0.01
kd: 0.015
ki: 0.005
max_tilt_deg: 4.0
pitch_sign: 1.0
roll_sign: 1.0

# Algorithm selector. 'pid' = continuous PID. 'bangbang' = state-
# machine controller (accelerate → coast → brake → settle).
algorithm: pid

# Bang-bang thresholds (only used when algorithm='bangbang').
accel_tilt_deg:    3.0
err_tol_mm:        15.0
v_brake_mm_s:      80.0
v_coast_mm_s:      30.0
brake_horizon_mm:  60.0

# Stiction breakthrough (bang-bang only). In ACCEL phase, if the
# ball's speed stays under stiction_v_threshold_mm_s for more than
# stiction_break_s, the controller bumps tilt to max_tilt_deg to
# break the ball loose. Foam-on-vinyl static friction otherwise
# pins the ball at accel_tilt=3° indefinitely.
stiction_v_threshold_mm_s: 20.0
stiction_break_s:          0.6

# Brake authority — separate from accel_tilt_deg because kinetic
# friction on a rolling ball is much lower than static friction
# on a stationary one. Once a foam ball is moving fast, you need
# MORE tilt to brake it than the ball needed to start moving.
# Default = max_tilt_deg (use full authority for brake).
brake_tilt_deg:    6.0

# Vision→command latency compensation. /oak/latency_ms reports
# ~70-100 ms capture→Pi; KF + control loop adds another ~20 ms.
# Total see-to-command latency ~100 ms. The bang-bang FSM
# extrapolates ball position forward by this time using KF
# velocity so phase decisions (especially BRAKE) fire on
# "where the ball will be" not "where the ball was 100 ms ago".
control_latency_s: 0.10
