# Level-loop PI gains. Loaded by stewart_control_node at startup AND
# on /control_cmd {cmd: level_reload_gains} so they can be tuned in
# place without rebuilding. See stewart_bringup/docs/level_pi_tuning_plan.md.
#
# Phase 4 of the tuning plan sweeps these via auto-sweep bag runs.
# Acceptance: settling-time(0.1°) <= 0.5 s AND steady-state RMS <= 0.05°
# at every Z in the operating range (30–50 mm).
#
# Iteration history (most recent on top):
#   2026-04-27 (iter 3): kp 1.5→1.0, ki 0.5→0.3, rate_limit 0.3→0.25.
#       Iter 2 caused a 0.4 Hz controller-driven limit cycle at Z=30+
#       (RMS jumped 3-7× vs iter 1) — the simultaneous 2.5× KP and 2.5×
#       KI bumps overshot the stability margin. Z=25 improved 8× though,
#       which says the deadband=0.02 change was correct (let integrator
#       chase sub-noise-floor drift), so we keep that and bisect KP/KI
#       between iter-1 (slow but stable) and iter-2 (fast but oscillating).
#   2026-04-27 (iter 2): kp 0.7→1.5, ki 0.2→0.5, deadband 0.05→0.02,
#       rate_limit 0.2→0.3. CAUSED OSCILLATION at Z=30-50; reverted
#       back toward iter-1 in iter-3. See sweep_20260427T164414Z digest.
#   2026-04-27 (iter 1, baseline): kp 0.7, ki 0.2, deadband 0.05,
#       rate_limit 0.2.

# Proportional gain (deg correction per deg error)
kp: 1.0

# Integral gain (deg/s correction per deg error)
ki: 0.3

# Deadband — errors smaller than this don't accumulate into the integrator.
# Below the MTi-630's static noise floor (~0.05°) so the integrator
# can chase the slow drift seen in iter-1 bags. Iter-2 evidence at
# Z=25 (RMS 0.64° → 0.09°) confirmed this change is correct on its own.
deadband_deg: 0.02

# Per-iteration rate limit on the correction signal (deg / 20 ms tick).
# Iter-3: 0.25, between iter-1's 0.2 and iter-2's 0.3, matching the
# bisection on KP.
rate_limit_deg_per_iter: 0.25

# Hard cap on the correction signal magnitude. Safety clamp; should rarely
# engage in normal operation.
max_corr_deg: 5.0

# IMU error low-pass filter coefficient (0..1). Higher = less filtering.
filter_alpha: 0.3
